name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SHELLCHECK_VERSION: v0.11.0
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install ShellCheck ${{ env.SHELLCHECK_VERSION }}
        run: |
          curl -fsSL -o shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/$SHELLCHECK_VERSION/shellcheck-$SHELLCHECK_VERSION.linux.x86_64.tar.xz"
          echo "$SHELLCHECK_SHA256  shellcheck.tar.xz" | sha256sum -c -
          tar -xJf shellcheck.tar.xz
          sudo install -m 0755 "shellcheck-$SHELLCHECK_VERSION/shellcheck" /usr/local/bin/shellcheck
          rm -rf shellcheck.tar.xz "shellcheck-$SHELLCHECK_VERSION"
          shellcheck --version

      - name: ShellCheck the scripts
        run: shellcheck --shell=sh --severity=style tailscale-update.sh tests/integration.sh

      - name: ShellCheck the generated OpenRC script
        run: sh tailscale-update.sh print-init-script | shellcheck --shell=sh --severity=style -

      - name: Check syntax with busybox ash
        run: docker run --rm -v "$PWD:/src:ro" alpine:latest sh -n /src/tailscale-update.sh

  test:
    name: test (alpine ${{ matrix.alpine }}${{ !matrix.openssl && ', no openssl' || '' }})
    runs-on: ubuntu-latest
    needs: shellcheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - alpine: "3.21"
            openssl: true
          - alpine: latest
            openssl: true
          - alpine: latest
            openssl: false
          - alpine: edge
            openssl: true
    steps:
      - uses: actions/checkout@v5

      - name: Run the integration tests
        shell: bash
        run: |
          setup=true
          if [ "${{ matrix.openssl }}" = true ]; then setup="apk add -q openssl"; fi
          timeout 600 docker run --rm -v "$PWD:/src:ro" "alpine:${{ matrix.alpine }}" \
            sh -c "$setup && sh /src/tests/integration.sh" | tee test.log

      - name: Record the test counts
        if: always()
        run: |
          line=$(grep -E '^[0-9]+ passed, [0-9]+ failed$' test.log 2>/dev/null | tail -n 1)
          if [ -n "$line" ]; then
            passed=${line%% passed*}
            failed=${line#*, }
            echo "$passed ${failed%% failed}" >result.txt
          else
            echo "0 1" >result.txt # the suite did not finish
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.alpine }}-${{ matrix.openssl }}
          path: result.txt

  # Publishes the shields.io endpoint behind the README's test count badge.
  badge:
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: badge
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results

      - name: Write the badge
        run: |
          passed=0 failed=0
          for f in results/*/result.txt; do
            [ -f "$f" ] || continue
            read -r p n <"$f"
            passed=$((passed + p))
            failed=$((failed + n))
          done
          if [ "$failed" -gt 0 ]; then
            message="$failed failed, $passed passed" color=red
          elif [ "$passed" -gt 0 ]; then
            message="$passed passed" color=brightgreen
          else
            message="not run" color=lightgrey
          fi
          mkdir badges
          printf '{"schemaVersion":1,"label":"tests","message":"%s","color":"%s"}\n' \
            "$message" "$color" >badges/tests.json
          cat badges/tests.json

      - name: Push to the badges branch
        working-directory: badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b badges
          git add tests.json
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Update test badge for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
